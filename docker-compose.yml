version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: truck_management_postgres
    environment:
      POSTGRES_DB: truck_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - truck_management_network

  backend:
    build: ./backend
    container_name: truck_management_backend
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - truck_management_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: truck_management_nginx
    ports:
      - "3000:80"   # 👈 LOCAL PORT
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - truck_management_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  truck_management_network:
    driver: bridge
